apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lance-context-master-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lance-context-master
spec:
  selector:
    app: lance-context-master
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lance-context-master
spec:
  # RocksDB is single-process. Run one master against this PVC.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lance-context-master
  template:
    metadata:
      labels:
        app: lance-context-master
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: master
          image: lance-context-master:latest
          imagePullPolicy: IfNotPresent
          env:
            # Replace with the same shared object-store prefix used by workers.
            - name: DATA_DIR
              value: s3://replace-me/rollouts
            - name: TASK_DB_PATH
              value: /var/lib/lance-context-master/tasks.rocksdb
            - name: TASK_HISTORY_LIMIT
              value: "1000"
            - name: MASTER_PORT
              value: "8090"
            # Adjust to the built UI asset path in the master image.
            - name: UI_DIR
              value: /app/ui
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: task-db
              mountPath: /var/lib/lance-context-master
      volumes:
        - name: task-db
          persistentVolumeClaim:
            claimName: lance-context-master-data
