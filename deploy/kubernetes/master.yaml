apiVersion: v1
kind: Service
metadata:
  name: lance-context-master
spec:
  selector:
    app: lance-context-master
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lance-context-master
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lance-context-master
  template:
    metadata:
      labels:
        app: lance-context-master
    spec:
      containers:
        - name: master
          image: lance-context-master:latest
          imagePullPolicy: IfNotPresent
          env:
            # Replace with the same shared object-store prefix used by workers.
            - name: DATA_DIR
              value: s3://replace-me/rollouts
            # Point this at a separate application etcd cluster, not the
            # Kubernetes control-plane etcd.
            - name: ETCD_ENDPOINTS
              value: https://etcd-0.etcd:2379,https://etcd-1.etcd:2379,https://etcd-2.etcd:2379
            - name: ETCD_PREFIX
              value: /lance-context/master
            - name: ETCD_LEASE_TTL_SECS
              value: "30"
            - name: ETCD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lance-context-etcd
                  key: username
                  optional: true
            - name: ETCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lance-context-etcd
                  key: password
                  optional: true
            - name: ETCD_CA_CERT
              value: /etc/lance-context/etcd/ca.crt
            - name: ETCD_CLIENT_CERT
              value: /etc/lance-context/etcd/tls.crt
            - name: ETCD_CLIENT_KEY
              value: /etc/lance-context/etcd/tls.key
            - name: TASK_HISTORY_LIMIT
              value: "1000"
            - name: MASTER_PORT
              value: "8090"
            - name: UI_DIR
              value: /app/ui
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: etcd-tls
              mountPath: /etc/lance-context/etcd
              readOnly: true
      volumes:
        - name: etcd-tls
          secret:
            secretName: lance-context-etcd-client-tls
