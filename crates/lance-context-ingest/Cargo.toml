[package]
name = "lance-context-ingest"
version = "0.6.7"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Durable rollout ingress over the independent lance-context WAL"

[features]
http = ["dep:axum", "dep:http-body-util"]
http-client = ["http", "dep:reqwest", "lance-context-wal/client-journal"]
materializer = ["lance-context-wal/lance-integration", "dep:lance", "dep:lance-table", "dep:object_store", "dep:futures"]

[dependencies]
axum = { version = "0.8", optional = true, default-features = false, features = ["json", "http1", "tokio"] }
http-body-util = { version = "0.1", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
lance = { version = "13.0.0", optional = true }
lance-table = { version = "13.0.0", optional = true }
object_store = { version = "0.14.2", optional = true }
futures = { version = "0.3", optional = true }
anyhow = "1"
arrow-array = "58"
arrow-schema = "58"
base64 = "0.22"
bytes = "1"
lance-context-core = { version = "0.6.7", path = "../lance-context-core" }
lance-context-wal = { version = "0.6.7", path = "../lance-context-wal", features = ["peer-transport", "ipc", "arrow-contract"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
arrow-ipc = "58"
lance = "13.0.0"
lance-table = "13.0.0"
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
