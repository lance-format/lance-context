[package]
name = "lance-context-core"
version = "0.2.4"
edition = "2021"
license = "Apache-2.0"
authors = ["Lance Devs <dev@lancedb.com>"]
repository = "https://github.com/lancedb/lance-context"
readme = "README.md"
description = "Multimodal, versioned context storage for agentic workflows"
keywords = ["context", "multimodal", "lance", "agents", "storage"]
categories = ["database", "data-structures", "science"]

[dependencies]
arrow-array = "58"
arrow-ipc = "58"
arrow-schema = "58"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lance = "7.0.0"
lance-index = "7.0.0"
lance-namespace = "7.0.0"
lancedb = "0.30.0"
lance-graph = "0.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
uuid = { version = "1.20.0", features = ["v4", "v5"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
