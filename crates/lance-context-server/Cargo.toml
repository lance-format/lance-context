[package]
name = "lance-context-server"
version = "0.6.7"
edition = "2021"
license = "Apache-2.0"
authors = ["Lance Devs <dev@lancedb.com>"]
repository = "https://github.com/lancedb/lance-context"
description = "REST API server for lance-context"
keywords = ["context", "lance", "server", "api"]

[[bin]]
name = "lance-context-server"
path = "src/main.rs"

[dependencies]
lance-context-merge = { version = "0.1.0", path = "../lance-context-merge" }
lance-context-core = { version = "0.6.7", path = "../lance-context-core" }
lance-context-api = { version = "0.6.7", path = "../lance-context-api" }
lance-context-metrics = { version = "0.1.0", path = "../lance-context-metrics" }
axum = { version = "0.8", features = ["json", "multipart"] }
bytes = "1"
futures = "0.3"
metrics = "0.24"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
lru = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
lance = "9.0.0"
tower = { version = "0.5", features = ["util"] }
etcd-client = { version = "0.19", features = ["tls"] }
# Snapshotting recorder so tests can assert which metric series an operation
# emitted, without installing a process-global Prometheus exporter.
metrics-util = { version = "0.19", default-features = false, features = [
    "debugging",
] }
tempfile = "3"
