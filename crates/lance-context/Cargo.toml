[package]
name = "lance-context"
version = "0.6.5"
edition = "2021"
license = "Apache-2.0"
authors = ["Lance Devs <dev@lancedb.com>"]
repository = "https://github.com/lancedb/lance-context"
description = "Multimodal, versioned context storage for agentic workflows"
readme = "README.md"

[features]
default = []
remote = ["lance-context-client"]

[dependencies]
lance-context-core = { version = "0.6.5", path = "../lance-context-core" }
lance-context-api = { version = "0.6.5", path = "../lance-context-api" }
lance-context-client = { version = "0.6.5", path = "../lance-context-client", optional = true }
serde_json = "1"
