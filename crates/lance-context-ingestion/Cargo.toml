[package]
name = "lance-context-ingestion"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bounded session-ordered ingestion with recoverable WAL and independent consumers"

[dependencies]
async-trait = "0.1"
futures = "0.3"
object_store = "0.13.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
