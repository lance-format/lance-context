name: Python Publish

on:
  release:
    types:
      - released
  pull_request:
    paths:
      - .github/workflows/python-publish.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run: build & test only, release: build & publish to PyPI"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C debuginfo=1"
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build distributions
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --sdist
          working-directory: python
          manylinux: "2_28"
          target: x86_64
          rust-toolchain: stable
          before-script-linux: |
            yum install -y openssl-devel protobuf-compiler

      - name: Verify manylinux wheel tag
        run: |
          ls python/dist/*manylinux_2_28_x86_64.whl

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist

      - name: Publish to PyPI
        if: >
          (github.event_name == 'release' && github.event.action == 'released') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')
        working-directory: python
        run: |
          uv publish --trusted-publishing always
