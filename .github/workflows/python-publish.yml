name: Python Publish

on:
  release:
    types:
      - released
  pull_request:
    paths:
      - .github/workflows/python-publish.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run: build & test only, release: build & publish to PyPI"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - release

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64
            manylinux: "2_28"
            wheel-pattern: "*manylinux_2_28_x86_64.whl"
            extra-args: "--sdist"
          - name: linux-aarch64
            os: ubuntu-24.04
            target: aarch64
            manylinux: "2_28"
            wheel-pattern: "*manylinux_2_28_aarch64.whl"
            extra-args: ""
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            wheel-pattern: "*macosx_11_0_arm64.whl"
            extra-args: ""
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C debuginfo=1"
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install protobuf

      - name: Build Linux distributions
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist ${{ matrix.extra-args }}
          working-directory: python
          manylinux: ${{ matrix.manylinux }}
          target: ${{ matrix.target }}
          rust-toolchain: stable
          before-script-linux: |
            if command -v yum >/dev/null 2>&1; then
              yum install -y curl openssl-devel
            elif command -v apt-get >/dev/null 2>&1; then
              if [ "${{ matrix.target }}" = "aarch64" ]; then
                for source_list in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
                  [ -f "${source_list}" ] || continue
                  sed -i -E \
                    -e 's#^(deb(-src)? )\[#\1[arch=amd64 #' \
                    -e 's#^(deb(-src)? )([^[][^ ]*)#\1[arch=amd64] \3#' \
                    "${source_list}"
                done
                cat >/etc/apt/sources.list.d/ubuntu-ports-arm64.list <<'EOF'
            deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
            deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
            deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
            deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
            EOF
                dpkg --add-architecture arm64
                apt-get update
                apt-get install -y curl ca-certificates libssl-dev:arm64
                mkdir -p /usr/aarch64-unknown-linux-gnu/include /usr/aarch64-unknown-linux-gnu/lib
                cp -a /usr/include/openssl /usr/aarch64-unknown-linux-gnu/include/
                if [ -d /usr/include/aarch64-linux-gnu/openssl ]; then
                  cp -a /usr/include/aarch64-linux-gnu/openssl/. /usr/aarch64-unknown-linux-gnu/include/openssl/
                fi
                cp -a /usr/lib/aarch64-linux-gnu/libcrypto.so* /usr/aarch64-unknown-linux-gnu/lib/
                cp -a /usr/lib/aarch64-linux-gnu/libssl.so* /usr/aarch64-unknown-linux-gnu/lib/
              else
                apt-get update
                apt-get install -y curl libssl-dev ca-certificates
              fi
            fi
            PROTOC_VERSION=25.6
            curl -LsS -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
            python3 - <<'PY'
            from zipfile import ZipFile
            ZipFile("/tmp/protoc.zip").extractall("/tmp/protoc")
            PY
            install -m 0755 /tmp/protoc/bin/protoc /usr/local/bin/protoc
            cp -R /tmp/protoc/include/* /usr/local/include/
            protoc --version

      - name: Build macOS distributions
        if: runner.os == 'macOS'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist ${{ matrix.extra-args }}
          working-directory: python
          target: ${{ matrix.target }}
          rust-toolchain: stable

      - name: Verify wheel tag
        run: |
          ls python/dist/${{ matrix.wheel-pattern }}

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.name }}
          path: python/dist

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          path: python/dist
          merge-multiple: true

      - name: Publish to PyPI
        if: >
          (github.event_name == 'release' && github.event.action == 'released') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')
        working-directory: python
        run: |
          uv publish --trusted-publishing always
