[workspace]
members = [
    "crates/lance-context-merge",
    "crates/lance-context-core",
    "crates/lance-context-ingest",
    "crates/lance-context-wal",
    "crates/lance-context-metrics",
    "crates/lance-context",
    "crates/lance-context-api",
    "crates/lance-context-server",
    "crates/lance-context-master",
    "crates/lance-context-client",
    "python",
]
resolver = "2"
exclude = ["vendor/raft-engine", "vendor/lance-io", "vendor/lance-core", "vendor/lance", "vendor/lance-encoding"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.metadata]
# reserved for future use

# Lance 14 task ownership and storage error compatibility; see vendor/lance-io/BACKPORT.md.
[patch.crates-io]
lance-io = { path = "vendor/lance-io" }
# Scoped encoder lifetime tracking, Lance 14.0.2; see vendor/lance-core/BACKPORT.md.
lance-core = { path = "vendor/lance-core" }
lance = { path = "vendor/lance" }
lance-encoding = { path = "vendor/lance-encoding" }
# Azure completion response-loss fix; same object_store 0.14.2, see vendor/lance-io/BACKPORT.md.
object_store = { git = "https://github.com/beinan/arrow-rs-object-store", rev = "1149230d06b87d2b458a1b6a886e0b8224498338" }
